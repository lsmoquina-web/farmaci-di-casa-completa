name: Compila APK Farmaci di casa

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test convertitore catalogo
        run: python tools/test_catalog.py

      - name: Crea catalogo AIFA offline
        run: python tools/build_catalog.py

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Chiave stabile per gli aggiornamenti
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 --decode > ~/.android/debug.keystore
          else
            echo 'ATTENZIONE: chiave temporanea. Il prossimo APK potrebbe richiedere disinstallazione. Esportare prima il backup.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Applica aggiornamento app
        run: python tools/upgrade_foto.py

      - name: Test e compilazione
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Rapporto build
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk > APK-SHA256.txt
          cat app/src/main/assets/catalog-info.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: Farmaci-di-casa-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            APK-SHA256.txt
            app/src/main/assets/catalog-info.json
          if-no-files-found: error
